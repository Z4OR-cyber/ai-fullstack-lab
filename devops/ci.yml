# ============================================================
# 第1题：GitHub Actions CI/CD Pipeline
# 功能：代码检查 → 单元测试 → 覆盖率 → 构建产物
# 触发：push + pull_request + 手动 workflow_dispatch
# 矩阵测试：Python 3.11 / 3.12 / 3.13
# ============================================================
name: CI

on:
  # push 到 main 和 develop 分支时触发
  push:
    branches: [main, develop]
  # 对 main 分支发起 PR 时触发
  pull_request:
    branches: [main]
  # 支持手动在 Actions 页面点击运行
  workflow_dispatch:

# 同一分支的新推送取消旧运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------- 代码检查 --------------------
  lint:
    name: 🔍 代码检查 (Lint)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: 安装 lint 工具
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint

      - name: flake8 检查（风格 + 基础错误）
        run: |
          # --max-line-length=100 限制行宽
          # --extend-ignore=E203,W503 忽略与 Black 格式化冲突的规则
          flake8 . --max-line-length=100 --extend-ignore=E203,W503 --count --show-source --statistics

      - name: pylint 检查（深度分析）
        run: |
          # --disable=missing-docstring 暂不强制文档字符串
          # --score=y 输出评分
          pylint --disable=missing-docstring,C0114,C0115,C0116 --score=y app/ || true

  # -------------------- 矩阵测试 --------------------
  test:
    name: 🧪 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # 一个版本失败不取消其他版本
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov pytest-xdist

      - name: 运行测试 + 生成覆盖率报告
        run: |
          # -n auto 使用多核并行加速
          # --cov=. 计算当前目录覆盖率
          # --cov-report=xml 生成 Cobertura XML（供 Codecov 上传）
          # --cov-report=term-missing 终端显示未覆盖行
          pytest -n auto --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=test-results.xml

      - name: 上传测试产物
        uses: actions/upload-artifact@v4
        if: always()  # 即使测试失败也上传
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          retention-days: 7

      # 将覆盖率报告上传到 Codecov（需要仓库设置 CODECOV_TOKEN secret）
      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.13'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false  # 覆盖率上传失败不阻断 CI

  # -------------------- 构建产物 --------------------
  build:
    name: 📦 构建产物
    runs-on: ubuntu-latest
    needs: [lint, test]  # 等待 lint 和 test 通过后才构建
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 构建 wheel 和 sdist
        run: python -m build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          retention-days: 14
