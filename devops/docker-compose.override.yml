# ============================================================
# 第3题：开发环境覆盖文件
# Docker Compose 会自动合并 docker-compose.yml + docker-compose.override.yml
# 开发环境特有：热重载 + 调试端口 + 详细日志
# ============================================================

services:
  # -------------------- 开发环境应用配置 --------------------
  app:
    # 开发环境覆盖启动命令，启用热重载
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --log-level debug
    # 挂载源代码到容器，实现热重载
    volumes:
      - ./:/app
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
    # 开发环境开放调试端口
    ports:
      - "8000:8000"
      - "5678:5678"  # Python debugger 端口

  # -------------------- 开发环境数据库 --------------------
  db:
    ports:
      - "5432:5432"  # 开发环境暴露数据库端口，方便本地连接
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: todo_dev

  # -------------------- 开发环境 Redis --------------------
  redis:
    ports:
      - "6379:6379"  # 开发环境暴露 Redis 端口
