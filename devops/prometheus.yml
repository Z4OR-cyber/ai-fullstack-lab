# ============================================================
# 第5题：Prometheus 配置
# 功能：抓取应用 /metrics 端点的指标数据
# ============================================================

global:
  # 抓取间隔（全局默认）
  scrape_interval: 15s
  # 规则评估间隔
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alerting_rules.yml"

# 告警推送目标（Alertmanager）
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# 抓取目标配置
scrape_configs:
  # -------------------- Prometheus 自身 --------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # -------------------- FastAPI 应用 --------------------
  - job_name: "todo-app"
    metrics_path: "/metrics"
    scrape_interval: 10s  # 应用指标更频繁抓取
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: "todo-app"
          env: "production"

  # -------------------- Node Exporter（主机指标）--------------------
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: "node-exporter"
